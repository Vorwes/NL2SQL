[project]
name = "nl2sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
backend = [
  "chromadb>=1.5.8",
  "fastapi>=0.139.0",
  "llama-cpp-python>=0.3.31",
  "pandas>=2.3.3",
  "psycopg[binary,pool]>=3.3.4",
  "sentence-transformers>=5.6.0",
  "torch>=2.12.1",
  "uvicorn>=0.46.0",
]

frontend = ["chainlit>=2.11.1", "httpx>=0.28.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
